[project]
name = "ato-investigation-agent"
version = "0.1.0"
description = "ATO investigation reproduction with a legacy mock protection harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
